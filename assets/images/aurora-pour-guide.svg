<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
<title id="title">Four aurora pours through packed ice</title><desc id="desc">Blue along one inside wall, green opposite, violet through upper-middle ice, and two to three pink streaks in separate channels. An illustrative guide, not a photograph.</desc>
